<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Fundo: azul do destaque passando pro lilás, de cima à esquerda pra baixo à direita. -->
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.55" stop-color="#7B6CFF"/>
      <stop offset="1" stop-color="#C38BFF"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="agulha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAE6FF"/>
    </linearGradient>
  </defs>
  <!-- Quadrado de cantos bem redondos (estilo dos ícones do Dia e do Arc). -->
  <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#fundo)"/>
  <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#brilho)"/>
  <!-- Agulha de bússola: "navegar". Metade cheia, metade vazada. -->
  <g transform="rotate(45 128 128)">
    <path d="M128 52 L156 128 L100 128 Z" fill="url(#agulha)"/>
    <path d="M100 128 L156 128 L128 204 Z" fill="#FFFFFF" fill-opacity="0.38"/>
  </g>
  <circle cx="128" cy="128" r="11" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="5" fill="#7B6CFF"/>
</svg>
